<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loaden Skibidi</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div id="menu" class="screen">
  <h1>LOADEN SKIBIDI</h1>
  <h2>Kies je skibidi-karakter en verover Alphahills</h2>
  <div class="cards" id="cards"></div>
  <button id="play">SPELEN</button>
  <div class="keys">
    <b>WASD</b> lopen · <b>Shift</b> rennen · <b>Spatie</b> springen · <b>Muis</b> camera<br>
    <b>Linkermuisknop</b> aanval · <b>Q / rechtermuisknop</b> speciale aanval · <b>E</b> dash · <b>Esc</b> pauze
  </div>
</div>

<div id="over" class="screen hidden">
  <h1 id="overTitle">GAME OVER</h1>
  <h2 id="overStats"></h2>
  <button id="again">OPNIEUW</button>
</div>

<div id="hud" class="hidden">
  <div class="tl">
    <div id="name" style="font-weight:700;margin-bottom:4px"></div>
    <div class="hp"><i id="hpFill"></i></div>
    <div class="cds">
      <div class="cd" id="cdA"><i></i><span>LMB</span></div>
      <div class="cd" id="cdS"><i></i><span>Q</span></div>
      <div class="cd" id="cdD"><i></i><span>E</span></div>
    </div>
  </div>
  <div class="tr"><div id="wave">Wave 1</div><div id="score">Score 0</div><div id="left" style="font-size:15px;opacity:.8"></div></div>
  <div id="boss" style="display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(420px,36vw);text-align:center;font-weight:700"><div id="bossName" style="color:#ff7a8a"></div><div class="hp"><i id="bossFill"></i></div></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="cross"></div>
  <div id="msg"></div>
  <div id="hint">Klik in het spel om de muis te vangen</div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
